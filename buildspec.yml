version: 0.2

phases:
  install:
    runtime-versions:
      docker: 20

  pre_build:
    commands:
      - echo Logging into DockerHub
      - echo $DOCKER_PASSWORD | docker login -u $DOCKER_USERNAME --password-stdin

  build:
    commands:
      - echo Building frontend
      - cd frontend
      - docker build -t hrushant1909/sefinalproject-frontend:1.0.0 .
      - docker push hrushant1909/sefinalproject-frontend:1.0.0
      - cd ..

      - echo Building backend
      - cd backend
      - docker build -t hrushant1909/sefinalproject-backend:1.0.0 .
      - docker push hrushant1909/sefinalproject-backend:1.0.0
      - cd ..

artifacts:
  files:
    - appspec.yml
    - scripts/**/*
    - docker-compose.yml